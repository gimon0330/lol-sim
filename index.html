<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1c24"><title>LoL Sim · 이동 연습장</title><meta name="description" content="Three.js로 만든 쿼터뷰 클릭 이동 게임. 바닥을 클릭해 이즈리얼을 움직여 보세요."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2430'/%3E%3Cpath d='M16 4 24 16 16 28 8 16Z' fill='%237de5de'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101f26;color:#e5e7d9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#world{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:crosshair}#world:focus-visible{outline:2px solid #b2d8ce;outline-offset:-3px}.top{position:absolute;inset:24px 28px auto;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.brand{border-left:2px solid #b49b62;padding:0 0 0 15px;text-shadow:0 2px 8px #000}.eyebrow{font-size:12px;letter-spacing:3px;color:#d3bd81}.brand h1{font-family:Georgia,serif;font-size:30px;font-weight:400;letter-spacing:3px;margin:4px 0}.brand p{margin:5px 0;color:#c7d9cf;font-size:14px}.badge{padding:8px 12px;background:#0b1c24dd;border:1px solid #7c82665e;font-size:12px;letter-spacing:1px}.bottom{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(600px,calc(100% - 32px));border:1px solid #9f8b58;background:linear-gradient(110deg,#0b1926f5,#142f38f5);box-shadow:0 8px 30px #0007;display:flex;align-items:center;gap:20px;padding:18px 20px}.level{width:48px;height:48px;display:grid;place-items:center;border:1px solid #9f8b58;background:#24424d;color:#e6cb8b;font-family:Georgia,serif;font-size:26px;flex-shrink:0}.details{flex:1;min-width:0}.name{display:flex;justify-content:space-between;gap:12px;font-size:16px}.name span{color:#9dcabc;font-size:13px}.bar{height:8px;background:#3b9670;margin:8px 0 5px;border:1px solid #72b997}.sub{display:flex;justify-content:space-between;font-size:12px;color:#93b2b9;font-variant-numeric:tabular-nums}.reset{background:#203a43;border:1px solid #657b78;color:#dbe5d9;border-radius:2px;padding:10px;cursor:pointer;font-size:14px}.reset:hover{background:#345460}.reset:focus-visible{outline:2px solid #b2f3df;outline-offset:4px}.hint{position:absolute;bottom:132px;left:50%;transform:translateX(-50%);margin:0;text-align:center;font-size:14px;color:#e </style></head><body>
<canvas id="world" tabindex="0" aria-label="3D 이동 연습장. 바닥을 클릭하거나 터치하면 이동합니다. S 키로 멈춥니다."></canvas>
<header class="top"><div class="brand"><div class="eyebrow">TRAINING GROUNDS</div><h1>EZREAL</h1><p>무모한 탐험가 · 이동 연습장</p></div><span class="badge">MOVEMENT 01</span></header>
<div id="hero-label"><b>이즈리얼</b><i></i></div>
<p class="hint">바닥을 클릭해 이동하세요 · 우클릭 / 터치도 가능</p>
<div class="keys"><kbd>S</kbd> 멈추기<br><kbd>SPACE</kbd> 캐릭터 중심 보기<br><kbd>휠</kbd> 확대 / 축소</div>
<footer class="bottom"><div class="level" aria-label="레벨 1">1</div><div class="details"><div class="name"><strong>이즈리얼</strong><span id="status" role="status">대기 중</span></div><div class="bar" aria-label="체력 100퍼센트"></div><div class="sub"><span>이동 속도 5.5</span><span id="coords">X -5.0 · Z 5.0</span></div></div><button class="reset" id="reset">위치 초기화</button></footer>
<div id="loading" class="overlay"><h2>연습장 준비 중</h2><p>잠시만 기다려 주세요.</p></div>

<noscript><div class="overlay">이 게임을 실행하려면 JavaScript를 켜 주세요.</div></noscript>
<script type="module">import('./src/game.js').catch(error=>{console.error(error);document.querySelector('#loading').hidden=true;document.querySelector('#error').hidden=false;});</script>
