<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101f26">
<title>LoL Sim · Ezreal</title>
<meta name="description" content="Three.js로 만든 이즈리얼 전투 연습장">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2430'/%3E%3Cpath d='M16 4 24 16 16 28 8 16Z' fill='%237de5de'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101f26;color:#e5e7d9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}#world{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:crosshair}#world:focus-visible{outline:2px solid #b2d8ce;outline-offset:-3px}.hud-top{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;pointer-events:auto}.enemy-stats{padding:6px 9px;border:1px solid #78908a7d;border-radius:3px;background:#0b1926a8;color:#d5e3dc;font-size:12px;text-shadow:0 1px 3px #000}.reset{width:30px;height:30px;padding:0;border:1px solid #78908a7d;border-radius:3px;background:#0b1926a8;color:#dbe5d9;cursor:pointer;font-size:17px;line-height:1}.reset:hover{background:#2a4d55}.reset:focus-visible{outline:2px solid #b2f3df;outline-offset:3px}.spellbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}.spell{position:relative;width:92px;min-height:56px;padding:6px 7px;background:#0b1926d9;color:#dcece5;border:1px solid #548295aa;cursor:pointer;border-radius:3px;display:grid;grid-template-columns:23px 1fr;align-items:center;gap:4px;text-align:left;box-shadow:0 3px 14px #0004}.spell kbd{font-family:Georgia,serif;color:#9fe9ff;font-size:20px}.spell .spell-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spell .cooldown{grid-column:1/-1;font-size:12px;text-align:center;color:#9cdaca;font-variant-numeric:tabular-nums}.spell[data-warm]{border-color:#a48b53aa}.spell[data-warm] kbd{color:#f4d483}.spell:disabled{opacity:.55;cursor:default}.spell[aria-pressed="true"]{border:2px solid #ffeea4;background:#315361}.spell:focus-visible{outline:2px solid #fff0a8;outline-offset:3px}.spell:hover:not(:disabled){background:#284b59}.spell-message{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);margin:0;opacity:0;color:#efd697;text-shadow:0 1px 3px #000;background:#10232ac9;padding:5px 10px;border-radius:3px;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .18s ease}.overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#0b1c24ed;padding:30px;z-index:5}.overlay h2{color:#d5c087;font-weight:500}.overlay p{line-height:1.7;max-width:500px}.overlay pre{width:min(680px,calc(100vw - 48px));max-height:38vh;overflow:auto;margin:16px auto;padding:12px;border:1px solid #6b8a91aa;border-radius:4px;background:#071116d9;color:#cce4dd;text-align:left;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.overlay[hidden],[hidden]{display:none!important}@media(max-width:560px){.hud-top{top:8px;right:8px}.spellbar{bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 16px);gap:4px}.spell{width:auto;flex:1;min-width:0;min-height:48px;padding:5px}.spell .spell-name{display:none}.spell kbd{font-size:18px}.spell .cooldown{font-size:11px}.spell-message{bottom:68px;font-size:11px;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="3D 전투 연습장. 바닥을 클릭하면 이동하고 적을 우클릭하면 공격합니다."></canvas>
<div class="hud-top"><span id="enemy-stats" class="enemy-stats">적 4 · 처치 0</span><button class="reset" id="reset" type="button" aria-label="연습 초기화" title="연습 초기화">↺</button></div>
<div class="spellbar" role="group" aria-label="스킬">
<button id="spell-Q" class="spell" aria-pressed="false" title="신비한 화살: 피해 50, 쿨타임 3초. 적중 시 전체 스킬 쿨타임 1초 감소"><kbd>Q</kbd><span class="spell-name">신비한 화살</span><span id="cooldown-Q" class="cooldown">준비</span></button>
<button id="spell-W" class="spell" data-warm aria-pressed="false" title="정수의 흐름: 5초 표식, 다른 스킬 적중 시 추가 피해 100. 쿨타임 6초"><kbd>W</kbd><span class="spell-name">정수의 흐름</span><span id="cooldown-W" class="cooldown">준비</span></button>
<button id="spell-E" class="spell" aria-pressed="false" title="비전 이동: 사거리 25, 도착지 25 이내 적에게 피해 50. 쿨타임 10초"><kbd>E</kbd><span class="spell-name">비전 이동</span><span id="cooldown-E" class="cooldown">준비</span></button>
<button id="spell-R" class="spell" data-warm aria-pressed="false" title="정조준 일격: 1초 준비 후 관통 투사체, 피해 200, 쿨타임 20초"><kbd>R</kbd><span class="spell-name">정조준 일격</span><span id="cooldown-R" class="cooldown">준비</span></button>
</div>
<p id="spell-message" class="spell-message" role="status">우클릭: 적 공격 · Shift+우클릭: 바닥 기준 자동 공격</p>
<div id="loading" class="overlay"><h2>연습장 준비 중</h2><p>잠시만 기다려 주세요.</p></div>
<div id="error" class="overlay" hidden><h2 id="error-title">3D 초기화 실패</h2><p id="error-copy">WebGL 초기화에 실패했습니다.</p><pre id="error-detail" aria-label="WebGL 진단 정보"></pre><button onclick="location.reload()" class="reset" aria-label="다시 열기">↻</button></div>
<noscript><div class="overlay">이 게임을 실행하려면 JavaScript를 켜 주세요.</div></noscript>
<script type="module">import('./src/game.js').catch(error=>{console.error(error);document.querySelector('#loading').hidden=true;const panel=document.querySelector('#error');if(!panel.dataset.shown){const title=document.querySelector('#error-title');const copy=document.querySelector('#error-copy');const detail=document.querySelector('#error-detail');if(title)title.textContent='게임 초기화 실패';if(copy)copy.textContent='게임 코드가 실행되지 않았습니다. 아래 오류를 개발자 도구와 함께 확인해 주세요.';if(detail&&!detail.textContent)detail.textContent='실행 오류: '+(error?.message||String(error));panel.dataset.shown='true';}panel.hidden=false;});</script>
</body>
</html>
